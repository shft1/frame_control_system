version: "3.9"

services:
  api_gateway:
    build:
      context: .
      dockerfile: infra/Dockerfile
    container_name: framecs-api-gateway
    restart: unless-stopped
    environment:
      APP_ENV: dev
      APP_PORT: 8080
      DB_PATH: /app/data/app.db
      JWT_SECRET: dev-secret-change-me
      CORS_ORIGINS: "*"
      LOG_LEVEL: info
      RATE_LIMIT_RPS: 10
      RATE_LIMIT_BURST: 20
    ports:
      - "8080:8080"
    volumes:
      - apigwdata:/app/data

  service_users:
    build:
      context: .
      dockerfile: infra/Dockerfile
    container_name: framecs-service-users
    restart: unless-stopped
    environment:
      APP_ENV: dev
      APP_PORT: 8081
      DB_PATH: /app/data/users.db
      JWT_SECRET: dev-secret-change-me
      CORS_ORIGINS: "*"
      LOG_LEVEL: info
      RATE_LIMIT_RPS: 10
      RATE_LIMIT_BURST: 20
    ports:
      - "8081:8081"
    volumes:
      - usersdata:/app/data

  service_orders:
    build:
      context: .
      dockerfile: infra/Dockerfile
    container_name: framecs-service-orders
    restart: unless-stopped
    environment:
      APP_ENV: dev
      APP_PORT: 8082
      DB_PATH: /app/data/orders.db
      JWT_SECRET: dev-secret-change-me
      CORS_ORIGINS: "*"
      LOG_LEVEL: info
      RATE_LIMIT_RPS: 10
      RATE_LIMIT_BURST: 20
    ports:
      - "8082:8082"
    volumes:
      - ordersdata:/app/data
volumes:
  apigwdata:
  usersdata:
  ordersdata:


